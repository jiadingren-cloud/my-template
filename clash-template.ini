[custom]
; ============================================================
; Jiadingren · 最终纯净在线订阅转换模板 (★已彻底铲除隐形标点符号冲突)
; ============================================================

# 基础设置
mixed-port = 7890
allow-lan = true
mode = rule
log-level = info
ipv6 = false

# DNS 优化 (完美适配旁路由 192.168.0.9 与 AdGuard Home 5335)
dns.enable = true
dns.listen = 0.0.0.0:1053
dns.ipv6 = false
dns.enhanced-mode = fake-ip
dns.fake-ip-range = 198.18.0.1/16

# 动态按天更新外部规则集
ruleset = 🖥️ 软件分流 [自选],clash-classical,https://jsdelivr.net
ruleset = 🛑 广告拦截 [系统],clash-classical,https://jsdelivr.net
ruleset = 🤖 AI服务 [自选],clash-classical,https://jsdelivr.net
ruleset = 📺 油管专用 [自选],clash-classical,https://jsdelivr.net
ruleset = 🎬 流媒体 [自选],clash-classical,https://jsdelivr.net
ruleset = 💰 币圈专用 [自选],clash-classical,https://jsdelivr.net
ruleset = 🍎 苹果服务 [自选],clash-classical,https://jsdelivr.net
ruleset = 🔍 谷歌服务 [自选],clash-classical,https://jsdelivr.net
ruleset = 💬 电报专用 [自选],clash-classical,https://jsdelivr.net
ruleset = 🇲🇸 微软服务 [自选],clash-classical,https://jsdelivr.net
ruleset = DIRECT,clash-classical,https://jsdelivr.net
ruleset = DIRECT,clash-classical,https://jsdelivr.net

# 核心自选组架构 (精简格式，彻底防范符号错乱)
custom_proxy_group = 🚀 默认代理 [自选]`select`♻️ 自动选择 [系统]`🇭康节点`🇯🇵日本节点`🇺🇸美国节点`🌐 全部节点 [系统]
custom_proxy_group = 🤖 AI服务 [自选]`select`🇺🇸美国节点`🇯🇵日本节点`🚀 默认代理 [自选]`DIRECT
custom_proxy_group = 📺 油管专用 [自选]`select`🇭康节点`🇯🇵日本节点`🇺🇸美国节点`🚀 默认代理 [自选]
custom_proxy_group = 🎬 流媒体 [自选]`select`🇺🇸美国节点`🇯🇵日本节点`🇭康节点`🚀 默认代理 [自选]
custom_proxy_group = 💬 电报专用 [自选]`select`🇭康节点`🇺🇸美国节点`🚀 默认代理 [自选]
custom_proxy_group = 🇲🇸 微软服务 [自选]`select`DIRECT`🚀 默认代理 [自选]
custom_proxy_group = 🍎 苹果服务 [自选]`select`DIRECT`🚀 默认代理 [自选]
custom_proxy_group = 🔍 谷歌服务 [自选]`select`🇺🇸美国节点`🚀 默认代理 [自选]
custom_proxy_group = 💰 币圈专用 [自选]`select`🚀 默认代理 [自选]`DIRECT
custom_proxy_group = 🖥️ 软件分流 [自选]`select`🚀 默认代理 [自选]`DIRECT

# 自动地区筛选 (增加末尾 DIRECT 绝对防空兜底)
custom_proxy_group = 🌐 全部节点 [系统]`select`[]`DIRECT
custom_proxy_group = ♻️ 自动选择 [系统]`url-test`[]`http://cloudflare.com`300,,50`DIRECT
custom_proxy_group = 🇭康节点`url-test`(?i)🇭🇰|香港|港|\bHK\b|\bHKG\b|Hong[ -]?Kong`http://cloudflare.com`300,,50`DIRECT
custom_proxy_group = 🇯🇵日本节点`url-test`(?i)🇯🇵|日本|日|\bJP\b|\bJPN\b|Japan|Tokyo|Osaka`http://cloudflare.com`300,,50`DIRECT
custom_proxy_group = 🇺🇸美国节点`url-test`(?i)🇺🇸|美国|美|\bUS\b|\bUSA\b|United[ -]?States|America`http://cloudflare.com`300,,50`DIRECT
custom_proxy_group = 🛑 广告拦截 [系统]`select`REJECT`DIRECT
