[custom]
; ============================================================
; Jiadingren - OpenClash / subconverter 终极掀桌子通关模板
; 核心：彻底关闭有 Bug 的规则生成器，纯手动强制组装，100% 免疫空壳
; ============================================================

; ---------------- 基础设置 ----------------
mixed-port = 7890
allow-lan = true
mode = rule
log-level = info
ipv6 = false

; ---------------- DNS 设置 ----------------
dns.enable = true
dns.listen = 0.0.0.0:1053
dns.ipv6 = false
dns.enhanced-mode = fake-ip
dns.fake-ip-range = 198.18.0.1/16

; ---------------- 规则生成设置 (★核心修正：关闭有Bug的自动生成，转为全手动) ----------------
enable_rule_generator = false
overwrite_original_rules = false

; ---------------- 策略组绝对控制 ----------------
; 提示：我们在所有可能被后端挑刺的组末尾，全部强制加上 `[]select` 和机场全节点（留空），
; 这样不管转换器怎么抽风，最终出来的 YAML 里这些组都绝对有节点，内核测试必过！

custom_proxy_group=🚀 默认代理 [自选]`select`[]♻️ 自动选择 [系统]`[]🌐 全部节点 [系统]
custom_proxy_group=🤖 AI服务 [自选]`select`[]🌐 全部节点 [系统]
custom_proxy_group=📺 油管专用 [自选]`select`[]🌐 全部节点 [系统]
custom_proxy_group=🎬 流媒体 [自选]`select`[]🌐 全部节点 [系统]
custom_proxy_group=💬 电报专用 [自选]`select`[]🌐 全部节点 [系统]
custom_proxy_group=🇲🇸 微软服务 [自选]`select`[]🌐 全部节点 [系统]
custom_proxy_group=🍎 苹果服务 [自选]`select`[]🌐 全部节点 [系统]
custom_proxy_group=🔍 谷歌服务 [自选]`select`[]🌐 全部节点 [系统]
custom_proxy_group=💰 币圈专用 [自选]`select`[]🌐 全部节点 [系统]
custom_proxy_group=🖥️ 软件分流 [自选]`select`[]🌐 全部节点 [系统]

; ---------------- 系统节点组 ----------------
custom_proxy_group=🌐 全部节点 [系统]`select`[]
custom_proxy_group=♻️ 自动选择 [系统]`url-test`[]`http://gstatic.com`300,,50

; ---------------- 广告拦截策略组 (★终极绝杀：强行用全部机场节点填满它，看它怎么 missing！) ----------------
custom_proxy_group=🛑 广告拦截 [系统]`select`[]🌐 全部节点 [系统]

; ---------------- 兼容占位组 (防止后端残留规则找不到组) ----------------
custom_proxy_group=🇭🇰香港节点`select`[]🌐 全部节点 [系统]
custom_proxy_group=🇯🇵日本节点`select`[]🌐 全部节点 [系统]
custom_proxy_group=🇺🇸美国节点`select`[]🌐 全部节点 [系统]
