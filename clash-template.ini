[custom]
; ============================================================
; Jiadingren · 终极通用在线更新模板 (★专注于解决测速与下载死结)
; ============================================================

# 基础设置
mixed-port = 7890
allow-lan = true
mode = rule
log-level = info
ipv6 = false

# DNS 优化 (确保提供者链接能够正常解析)
dns.enable = true
dns.listen = 0.0.0.0:1053
dns.ipv6 = false
dns.enhanced-mode = fake-ip
dns.fake-ip-range = 198.18.0.1/16

# 规则生成设置 (开启，以便兼容各类机场的默认策略组)
enable_rule_generator = true
overwrite_original_rules = true

# ---------------- ★测速修正核心 (强行注入秒通的国内测速链接) ----------------
# 强制让后端在生成异步节点列表 (proxy-providers) 时，使用 cloudflare 进行有效测速
provider_health_check_url = http://cloudflare.com
provider_health_check_interval = 300

# 基础策略组定义 (使用通用通配符，未来更换任何机场都可无缝兼容)
custom_proxy_group = 🚀 手动选择`select`[]♻️ 自动选择 [系统]`[]🌐 全部节点 [系统]
custom_proxy_group = 🌐 全部节点 [系统]`select`.*
custom_proxy_group = ♻️ 自动选择 [系统]`url-test`.*`http://cloudflare.com`300,,50
custom_proxy_group = 🎯 全球直连`select`[]DIRECT
custom_proxy_group = 🛑 广告拦截 [系统]`select`[]REJECT`[]🎯 全球直连`[]🚀 手动选择

# 兼容占位组 (防止后端 ACL4SSR 规则链因为找不到基本组而报错)
custom_proxy_group = 🤖 ChatGPT`select`[]🚀 手动选择`[]🎯 全球直连
custom_proxy_group = 💬 即时通讯`select`[]🚀 手动选择`[]🎯 全球直连
custom_proxy_group = 🌐 社交媒体`select`[]🚀 手动选择`[]🎯 全球直连
custom_proxy_group = 🎯 全球直连`select`[]DIRECT
