[custom]
; ============================================================
; Jiadingren - 纯英文纯净在线转换模板 (★彻底根除Emoji及空格引发的组丢失报错)
; ============================================================

; ---------------- 基础设置 ----------------
mixed-port = 7890
allow-lan = true
mode = rule
log-level = info
ipv6 = false

; ---------------- DNS 设置 ----------------
dns.enable = true
dns.listen = 0.0.0.0:1053
dns.ipv6 = false
dns.enhanced-mode = fake-ip
dns.fake-ip-range = 198.18.0.1/16

; ---------------- 规则生成设置 ----------------
enable_rule_generator = true
overwrite_original_rules = true

; ---------------- 规则集 ----------------
ruleset=AdBlock,https://githubusercontent.com
ruleset=AdBlock,https://githubusercontent.com
ruleset=AI-Services,https://githubusercontent.com
ruleset=YouTube,https://githubusercontent.com
ruleset=Streaming,https://githubusercontent.com
ruleset=Streaming,https://githubusercontent.com
ruleset=Apple,https://githubusercontent.com
ruleset=Google,https://githubusercontent.com
ruleset=Telegram,https://githubusercontent.com
ruleset=Microsoft,https://githubusercontent.com
ruleset=DIRECT,https://githubusercontent.com
ruleset=DIRECT,https://githubusercontent.com
ruleset=DIRECT,[]GEOIP,CN
ruleset=Proxy,[]FINAL

; ---------------- 主要策略组 ----------------
custom_proxy_group=Proxy`select`[]Auto-Select`[]HongKong`[]Japan`[]USA`[]All-Nodes
custom_proxy_group=AI-Services`select`[]USA`[]Japan`[]Proxy`[]DIRECT
custom_proxy_group=YouTube`select`[]HongKong`[]Japan`[]USA`[]Proxy
custom_proxy_group=Streaming`select`[]USA`[]Japan`[]HongKong`[]Proxy
custom_proxy_group=Telegram`select`[]HongKong`[]USA`[]Proxy
custom_proxy_group=Microsoft`select`[]DIRECT`[]Proxy
custom_proxy_group=Apple`select`[]DIRECT`[]Proxy
custom_proxy_group=Google`select`[]USA`[]Proxy
custom_proxy_group=Crypto`select`[]Proxy`[]DIRECT
custom_proxy_group=Software`select`[]Proxy`[]DIRECT

; ---------------- 系统节点组 ----------------
custom_proxy_group=All-Nodes`select`.*
custom_proxy_group=Auto-Select`url-test`.*`http://gstatic.com`300,,50

; ---------------- 广告拦截策略组 ----------------
custom_proxy_group=AdBlock`select`REJECT`DIRECT

; ---------------- 地区自动测速组 ----------------
custom_proxy_group=HongKong`url-test`(?i)🇭🇰|香港|港|\bHK\b|\bHKG\b|Hong[ -]?Kong`http://gstatic.com`300,,50
custom_proxy_group=Japan`url-test`(?i)🇯🇵|日本|日|\bJP\b|\bJPN\b|Japan|Tokyo|Osaka`http://gstatic.com`300,,50
custom_proxy_group=USA`url-test`(?i)🇺🇸|美国|美|\bUS\b|\bUSA\b|United[ -]?States|America`http://gstatic.com`300,,50
