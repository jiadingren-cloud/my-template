[custom]
; ============================================================
; Jiadingren · OpenClash 终极通关模板 (强制刷新缓存版 v2.0)
; 核心：使用 !!MIN 官方全节点包语法，彻底降维打击空字符串 Bug
; ============================================================

# 基础设置
mixed-port = 7890
allow-lan = true
mode = rule
log-level = info
ipv6 = false

# DNS 设置
dns.enable = true
dns.listen = 0.0.0.0:1053
dns.ipv6 = false
dns.enhanced-mode = fake-ip
dns.fake-ip-range = 198.18.0.1/16

# 规则生成设置 (彻底保持关闭，防止后端魔改干扰)
enable_rule_generator = false
overwrite_original_rules = false

# 主要策略组架构 (使用内置全节点包，100% 免疫空壳变异)
custom_proxy_group = 🚀 默认代理 [自选]`select`[]♻️ 自动选择 [系统]`[]🌐 全部节点 [系统]
custom_proxy_group = 🤖 AI服务 [自选]`select`[]🌐 全部节点 [系统]`[]🚀 默认代理 [自选]`[]DIRECT
custom_proxy_group = 📺 油管专用 [自选]`select`[]🌐 全部节点 [系统]`[]🚀 默认代理 [自选]
custom_proxy_group = 🎬 流媒体 [自选]`select`[]🌐 全部节点 [系统]`[]🚀 默认代理 [自选]
custom_proxy_group = 💬 电报专用 [自选]`select`[]🌐 全部节点 [系统]`[]🚀 默认代理 [自选]
custom_proxy_group = 🇲🇸 微软服务 [自选]`select`[]DIRECT`[]🚀 默认代理 [自选]
custom_proxy_group = 🍎 苹果服务 [自选]`select`[]DIRECT`[]🚀 默认代理 [自选]
custom_proxy_group = 🔍 谷歌服务 [自选]`select`[]🌐 全部节点 [系统]`[]🚀 默认代理 [自选]
custom_proxy_group = 💰 币圈专用 [自选]`select`[]🚀 默认代理 [自选]`[]DIRECT
custom_proxy_group = 🖥️ 软件分流 [自选]`select`[]🚀 默认代理 [自选]`[]DIRECT

# 系统核心组 (★终极改动：使用官方标准 !!MIN 展开机场全部节点)
custom_proxy_group = 🌐 全部节点 [系统]`select`!!MIN
custom_proxy_group = ♻️ 自动选择 [系统]`url-test`!!MIN`http://gstatic.com`300,,50

# 广告拦截策略组
custom_proxy_group = 🛑 广告拦截 [系统]`select`[]🌐 全部节点 [系统]`[]DIRECT

# 兜底占位组
custom_proxy_group = 🇭康节点`select`[]🌐 全部节点 [系统]
custom_proxy_group = 🇯🇵日本节点`select`[]🌐 全部节点 [系统]
custom_proxy_group = 🇺🇸美国节点`select`[]🌐 全部节点 [系统]
