[custom]
; ============================================================
; Jiadingren - OpenClash / subconverter 完美通关模板 (最终完美对齐版)
; 核心：补齐并对齐后端 ACL4SSR 规则强制要求的【🚀 手动选择】策略组
; ============================================================

; ---------------- 基础设置 ----------------
mixed-port = 7890
allow-lan = true
mode = rule
log-level = info
ipv6 = false

; ---------------- DNS 设置 ----------------
dns.enable = true
dns.listen = 0.0.0.0:1053
dns.ipv6 = false
dns.enhanced-mode = fake-ip
dns.fake-ip-range = 198.18.0.1/16

; ---------------- 规则生成设置 ----------------
enable_rule_generator = true
overwrite_original_rules = true

; ---------------- 主要策略组 (★重点：将默认组名字完美对齐为后端索要的 🚀 手动选择) ----------------
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择 [系统]`[]🇭🇰香港节点`[]🇯🇵日本节点`[]🇺🇸美国节点`[]🌐 全部节点 [系统]
custom_proxy_group=🤖 AI服务 [自选]`select`[]🇺🇸美国节点`[]🇯🇵日本节点`[]🚀 手动选择`[]🎯 全球直连
custom_proxy_group=📺 油管专用 [自选]`select`[]🇭🇰香港节点`[]🇯🇵日本节点`[]🇺🇸美国节点`[]🚀 手动选择
custom_proxy_group=🎬 流媒体 [自选]`select`[]🇺🇸美国节点`[]🇯🇵日本节点`[]🇭🇰香港节点`[]🚀 手动选择
custom_proxy_group=💬 电报专用 [自选]`select`[]🇭🇰香港节点`[]🇺🇸美国节点`[]🚀 手动选择
custom_proxy_group=🇲🇸 微软服务 [自选]`select`[]🎯 全球直连`[]🚀 手动选择
custom_proxy_group=🍎 苹果服务 [自选]`select`[]🎯 全球直连`[]🚀 手动选择
custom_proxy_group=🔍 谷歌服务 [自选]`select`[]🇺🇸美国节点`[]🚀 手动选择
custom_proxy_group=💰 币圈专用 [自选]`select`[]🚀 手动选择`[]🎯 全球直连
custom_proxy_group=🖥️ 软件分流 [自选]`select`[]🚀 手动选择`[]🎯 全球直连

; ---------------- 系统节点组 ----------------
custom_proxy_group=🌐 全部节点 [系统]`select`.*
custom_proxy_group=♻️ 自动选择 [系统]`url-test`.*`http://gstatic.com`300,,50

; ---------------- 广告拦截策略组 ----------------
custom_proxy_group=🛑 广告拦截 [系统]`select`[]REJECT`[]🎯 全球直连`[]🚀 手动选择

; ---------------- 核心补齐：直连策略组 ----------------
custom_proxy_group=🎯 全球直连`select`[]DIRECT

; ---------------- 地区自动测速组 ----------------
custom_proxy_group=🇭🇰香港节点`url-test`(?i)🇭🇰|香港|港|\bHK\b|\bHKG\b|Hong[ -]?Kong`http://gstatic.com`300,,50
custom_proxy_group=🇯🇵日本节点`url-test`(?i)🇯🇵|日本|日|\bJP\b|\bJPN\b|Japan|Tokyo|Osaka`http://gstatic.com`300,,50
custom_proxy_group=🇺🇸美国节点`url-test`(?i)🇺🇸|美国|美|\bUS\b|\bUSA\b|United[ -]?States|America`http://gstatic.com`300,,50
