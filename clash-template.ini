[custom]
; ============================================================
; Jiadingren · OpenClash 在线转换通用最终版模板 (★全量修复测速死结)
; 基准环境：api.asailor.org (SubConverter-Extended v1.9.15-23f93c1)
; ============================================================

# 基础设置
mixed-port = 7890
allow-lan = true
mode = rule
log-level = info
ipv6 = false

# DNS 标准优化
dns.enable = true
dns.listen = 0.0.0.0:1053
dns.ipv6 = false
dns.enhanced-mode = fake-ip
dns.fake-ip-range = 198.18.0.1/16

# 规则生成设置 (彻底保持本地托管，防止后端硬编码规则干扰)
enable_rule_generator = false
overwrite_original_rules = true

# ---------------- ★核心修正：强制重写全局 Provider 测速标准协议 ----------------
# 只要后端生成异步节点包 (proxy-providers)，一律强制使用国内秒通的标准 cloudflare 地址进行测速
provider_health_check_url = http://cloudflare.com
provider_health_check_interval = 300

# 强制注入所有策略组，并用全节点包 (!!MIN) 自动展开机场全量节点
proxy_group = 🚀 手动选择`select`!!MIN
proxy_group = 🤖 AI服务 [自选]`select`!!MIN`[]🎯 全球直连
proxy_group = 🤖 ChatGPT`select`!!MIN`[]🚀 手动选择
proxy_group = 📺 油管专用 [自选]`select`!!MIN`[]🚀 手动选择
proxy_group = 🎬 流媒体 [自选]`select`!!MIN`[]🚀 手动选择
proxy_group = 🎬 Netflix`select`!!MIN`[]🚀 手动选择
proxy_group = 📢 Disney+`select`!!MIN`[]🚀 手动选择
proxy_group = 💬 即时通讯`select`!!MIN`[]🚀 手动选择
proxy_group = 💬 电报专用 [自选]`select`!!MIN`[]🚀 手动选择
proxy_group = 🌐 社交媒体`select`!!MIN`[]🚀 手动选择
proxy_group = 🇲🇸 微软服务 [自选]`select`[]🎯 全球直连`!!MIN
proxy_group = 🍎 苹果服务 [自选]`select`[]🎯 全球直连`!!MIN
proxy_group = 🔍 谷歌服务 [自选]`select`!!MIN`[]🚀 手动选择
proxy_group = 💰 币圈专用 [自选]`select`!!MIN`[]🎯 全球直连
proxy_group = 🖥️ 软件分流 [自选]`select`!!MIN`[]🎯 全球直连
proxy_group = 🌍 国外网站`select`!!MIN
proxy_group = 🇨🇳 国内网站`select`[]🎯 全球直连
proxy_group = 🐟 漏网之鱼`select`!!MIN`[]🎯 全球直连

# 系统与基础组 (★严格纠正：补齐标准 http:// 前缀与双斜杠，完美通过内核格式校验)
proxy_group = 🌐 全部节点 [系统]`select`!!MIN
proxy_group = ♻️ 自动选择 [系统]`url-test`!!MIN`http://cloudflare.com`300,,50
proxy_group = 🛑 广告拦截 [系统]`select`[]REJECT`[]🎯 全球直连`[]🚀 手动选择
proxy_group = 🎯 全球直连`select`[]DIRECT

# 兼容占位
proxy_group = 🇭🇰香港节点`select`!!MIN
proxy_group = 🇯🇵日本节点`select`!!MIN
proxy_group = 🇺🇸美国节点`select`!!MIN

# ---------------- 币圈分流保持活跃规则 ----------------
rules =
  - DOMAIN-KEYWORD,binance,💰 币圈专用 [自选]
  - DOMAIN-KEYWORD,okx,💰 币圈专用 [自选]
  - DOMAIN-KEYWORD,bybit,💰 币圈专用 [自选]
  - DOMAIN-KEYWORD,gateio,💰 币圈专用 [自选]
  - DOMAIN-KEYWORD,coinbase,💰 币圈专用 [自选]
