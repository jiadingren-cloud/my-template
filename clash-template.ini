[custom]
; ============================================================
; Jiadingren · 专属本地在线订阅转换模板 (★已彻底修复双引号手误)
; ============================================================

; 基础设置
mixed-port = 7890
allow-lan = true
mode = rule
log-level = info
ipv6 = false

; DNS 优化 (完美适配您的旁路由 192.168.0.9 与 AdGuard Home 5335)
dns.enable = true
dns.listen = 0.0.0.0:1053
dns.ipv6 = false
dns.enhanced-mode = fake-ip
dns.fake-ip-range = 198.18.0.1/16
dns.fake-ip-filter = *.lan, *.local, *.aliyun.com

; 自动按天更新外部云端规则集
ruleset = 🖥️ 软件分流 [自选],clash-classical,https://jsdelivr.net
ruleset = 🛑 广告拦截 [系统],clash-classical,https://jsdelivr.net
ruleset = 🤖 AI服务 [自选],clash-classical,https://jsdelivr.net
ruleset = 📺 油管专用 [自选],clash-classical,https://jsdelivr.net
ruleset = 🎬 流媒体 [自选],clash-classical,https://jsdelivr.net
ruleset = 🎬 流媒体 [自选],geosite,netflix
ruleset = 💰 币圈专用 [自选],clash-classical,https://jsdelivr.net
ruleset = 🍎 苹果服务 [自选],clash-classical,https://jsdelivr.net
ruleset = 🔍 谷歌服务 [自选],clash-classical,https://jsdelivr.net
ruleset = 💬 电报专用 [自选],geosite,telegram
ruleset = 🇲🇸 微软服务 [自选],geosite,microsoft
ruleset = DIRECT,geosite,cn
ruleset = DIRECT,geoip,cn,no-resolve
ruleset = DIRECT,geoip,private,no-resolve

; 自动创建并匹配各大自选与系统策略组
custom_proxy_group = 🚀 默认代理 [自选]`select`♻️ 自动选择 [系统]`🇭🇰 香港节点 [系统]`🇯🇵 日本节点 [系统]`🇸🇬 新加坡节点 [系统]`🇺🇸 美国节点 [系统]`🇹🇼 台湾节点 [系统]`🌍 其他地区 [系统]`🌐 全部节点 [系统]
custom_proxy_group = 🤖 AI服务 [自选]`select`🇺🇸 美国节点 [系统]`🇯🇵 日本节点 [系统]`🇸🇬 新加坡节点 [系统]`🇭🇰 香港节点 [系统]`🇹🇼 台湾节点 [系统]`🌍 其他地区 [系统]`🌐 全部节点 [系统]`DIRECT
custom_proxy_group = 📺 油管专用 [自选]`select`🇭🇰 香港节点 [系统]`🇺🇸 美国节点 [系统]`🇯🇵 日本节点 [系统]`🇸🇬 新加坡节点 [系统]`🇹🇼 台湾节点 [系统]`🌍 其他地区 [系统]`🌐 全部节点 [系统]`DIRECT
custom_proxy_group = 🎬 流媒体 [自选]`select`🇺🇸 美国节点 [系统]`🇯🇵 日本节点 [系统]`🇭🇰 香港节点 [系统]`🇸🇬 新加坡节点 [系统]`🇹🇼 台湾节点 [系统]`🌍 其他地区 [系统]`🌐 全部节点 [系统]`DIRECT
custom_proxy_group = 💬 电报专用 [自选]`select`🇭🇰 香港节点 [系统]`🇸🇬 新加坡节点 [系统]`🇯🇵 日本节点 [系统]`🇺🇸 美国节点 [系统]`🇹🇼 台湾节点 [系统]`🌍 其他地区 [系统]`🌐 全部节点 [系统]`DIRECT
custom_proxy_group = 🇲🇸 微软服务 [自选]`select`🇯🇵 日本节点 [系统]`🇸🇬 新加坡节点 [系统]`🇺🇸 美国节点 [系统]`🇭🇰 香港节点 [系统]`🇹🇼 台湾节点 [系统]`🌍 其他地区 [系统]`🌐 全部节点 [系统]`DIRECT
custom_proxy_group = 🍎 苹果服务 [自选]`select`🇭🇰 香港节点 [系统]`🇯🇵 日本节点 [系统]`🇸🇬 新加坡节点 [系统]`🇺🇸 美国节点 [系统]`🇹🇼 台湾节点 [系统]`🌍 其他地区 [系统]`🌐 全部节点 [系统]`DIRECT
custom_proxy_group = 🔍 谷歌服务 [自选]`select`🇺🇸 美国节点 [系统]`🇯🇵 日本节点 [系统]`🇸🇬 新加坡节点 [系统]`🇭🇰 香港节点 [系统]`🇹🇼 台湾节点 [系统]`🌍 其他地区 [系统]`🌐 全部节点 [系统]`DIRECT
custom_proxy_group = 💰 币圈专用 [自选]`select`🇭🇰 香港节点 [系统]`🇸🇬 新加坡节点 [系统]`🇯🇵 日本节点 [系统]`🇺🇸 美国节点 [系统]`🇹🇼 台湾节点 [系统]`🌍 其他地区 [系统]`🌐 全部节点 [系统]`DIRECT
custom_proxy_group = 🖥️ 软件分流 [自选]`select`🚀 默认代理 [自选]`♻️ 自动选择 [系统]`🇭🇰 香港节点 [系统]`🇯🇵 日本节点 [系统]`🇸🇬 新加坡节点 [系统]`🇺🇸 美国节点 [系统]`🇹🇼 台湾节点 [系统]`🌍 其他地区 [系统]`🌐 全部节点 [系统]`DIRECT

; 地区自动正则表达式过滤
custom_proxy_group = 🌐 全部节点 [系统]`select`[]
custom_proxy_group = ♻️ 自动选择 [系统]`url-test`[]`http://cloudflare.com`300,,50
custom_proxy_group = 🇭🇰 香港节点 [系统]`url-test`(?i)🇭🇰|香港|港|\bHK\b|\bHKG\b|Hong[ -]?Kong`http://cloudflare.com`300,,50
custom_proxy_group = 🇯🇵 日本节点 [系统]`url-test`(?i)🇯🇵|日本|日|\bJP\b|\bJPN\b|Japan|Tokyo|Osaka`http://cloudflare.com`300,,50
custom_proxy_group = 🇸🇬 新加坡节点 [系统]`url-test`(?i)🇸🇬|新加坡|新国|\bSG\b|\bSGP\b|Singapore`http://cloudflare.com`300,,50
custom_proxy_group = 🇺🇸 美国节点 [系统]`url-test`(?i)🇺🇸|美国|美|\bUS\b|\bUSA\b|United[ -]?States|America|Los[ -]?Angeles|New[ -]?York|San[ -]?Francisco`http://cloudflare.com`300,,50
custom_proxy_group = 🇹🇼 台湾节点 [系统]`url-test`(?i)🇹🇼|台湾|台|\bTW\b|\bTWN\b|Taiwan|Taipei`http://cloudflare.com`300,,50
custom_proxy_group = 🌍 其他地区 [系统]`select`(?i)^(?!.*(?:🇭🇰|🇯🇵|🇸🇬|🇺🇸|🇹🇼|香港|日本|新加坡|美国|台湾|\bHK\b|\bHKG\b|\bJP\b|\bJPN\b|\bSG\b|\bSGP\b|\bUS\b|\bUSA\b|\bTW\b|\bTWN\b|Hong[ -]?Kong|Japan|Tokyo|Osaka|Singapore|United[ -]?States|America|Los[ -]?Angeles|New[ -]?York|San[ -]?Francisco|Taiwan|Taipei)).*
custom_proxy_group = 🛑 广告拦截 [系统]`select`REJECT`DIRECT
