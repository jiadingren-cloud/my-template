[custom]
; ============================================================
; Jiadingren - OpenClash / subconverter-ng 在线转换模板
; 目标：优先保证转换结构清晰，避免空策略组
; ============================================================

; ---------------- 基础设置 ----------------
mixed-port = 7890
allow-lan = true
mode = rule
log-level = info
ipv6 = false

; ---------------- DNS 设置 ----------------
dns.enable = true
dns.listen = 0.0.0.0:1053
dns.ipv6 = false
dns.enhanced-mode = fake-ip
dns.fake-ip-range = 198.18.0.1/16

; ---------------- 规则生成设置 ----------------
enable_rule_generator = true
overwrite_original_rules = true

; ---------------- 规则集 ----------------
; 使用实际规则文件 URL，不使用网站首页

; 广告拦截
ruleset=🛑 广告拦截 [系统],https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 广告拦截 [系统],https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; AI 服务
ruleset=🤖 AI服务 [自选],https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; YouTube
ruleset=📺 油管专用 [自选],https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list

; 流媒体
ruleset=🎬 流媒体 [自选],https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=🎬 流媒体 [自选],https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

; Apple / Google / Telegram / Microsoft
ruleset=🍎 苹果服务 [自选],https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=🔍 谷歌服务 [自选],https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list
ruleset=💬 电报专用 [自选],https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🇲🇸 微软服务 [自选],https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list

; 国内地址直连
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=DIRECT,[]GEOIP,CN

; 其他未匹配流量
ruleset=🚀 默认代理 [自选],[]FINAL

; ---------------- 主要策略组 ----------------

custom_proxy_group=🚀 默认代理 [自选]`select`[]♻️ 自动选择 [系统]`[]🇭🇰香港节点`[]🇯🇵日本节点`[]🇺🇸美国节点`[]🌐 全部节点 [系统]

custom_proxy_group=🤖 AI服务 [自选]`select`[]🇺🇸美国节点`[]🇯🇵日本节点`[]🚀 默认代理 [自选]`[]DIRECT

custom_proxy_group=📺 油管专用 [自选]`select`[]🇭🇰香港节点`[]🇯🇵日本节点`[]🇺🇸美国节点`[]🚀 默认代理 [自选]

custom_proxy_group=🎬 流媒体 [自选]`select`[]🇺🇸美国节点`[]🇯🇵日本节点`[]🇭🇰香港节点`[]🚀 默认代理 [自选]

custom_proxy_group=💬 电报专用 [自选]`select`[]🇭🇰香港节点`[]🇺🇸美国节点`[]🚀 默认代理 [自选]

custom_proxy_group=🇲🇸 微软服务 [自选]`select`[]DIRECT`[]🚀 默认代理 [自选]

custom_proxy_group=🍎 苹果服务 [自选]`select`[]DIRECT`[]🚀 默认代理 [自选]

custom_proxy_group=🔍 谷歌服务 [自选]`select`[]🇺🇸美国节点`[]🚀 默认代理 [自选]

custom_proxy_group=💰 币圈专用 [自选]`select`[]🚀 默认代理 [自选]`[]DIRECT

custom_proxy_group=🖥️ 软件分流 [自选]`select`[]🚀 默认代理 [自选]`[]DIRECT

; ---------------- 系统节点组 ----------------

custom_proxy_group=🌐 全部节点 [系统]`select`.*

custom_proxy_group=♻️ 自动选择 [系统]`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; ---------------- 广告拦截策略组 ----------------

custom_proxy_group=🛑 广告拦截 [系统]`select`REJECT`DIRECT

; ---------------- 地区自动测速组 ----------------

custom_proxy_group=🇭🇰香港节点`url-test`(?i)🇭🇰|香港|港|\bHK\b|\bHKG\b|Hong[ -]?Kong`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇯🇵日本节点`url-test`(?i)🇯🇵|日本|日|\bJP\b|\bJPN\b|Japan|Tokyo|Osaka`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇺🇸美国节点`url-test`(?i)🇺🇸|美国|美|\bUS\b|\bUSA\b|United[ -]?States|America`http://www.gstatic.com/generate_204`300,,50

; ---------------- 文件结束 ----------------
