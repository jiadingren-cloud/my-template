[custom]
; ============================================================
; Jiadingren · OpenClash 在线转换完美收官模板 (★终极解决节点全灰死锁)
; 核心：命令内核通过代理组去拉取节点，彻底打破直连下载失败的死循环
; ============================================================

# 基础设置
mixed-port = 7890
allow-lan = true
mode = rule
log-level = info
ipv6 = false

# DNS 标准优化
dns.enable = true
dns.listen = 0.0.0.0:1053
dns.ipv6 = false
dns.enhanced-mode = fake-ip
dns.fake-ip-range = 198.18.0.1/16

# 规则生成设置 (彻底保持本地托管，防止后端硬编码规则干扰)
enable_rule_generator = false
overwrite_original_rules = true

# ---------------- ★核心修正：强制改变 Provider 下载与测速策略 ----------------
# 1. 强制让后端在生成异步节点包时，通过【🚀 手动选择】借用代理通道去下载节点，防止直连被墙阻断
provider_proxy = 🚀 手动选择
# 2. 强制使用国内秒通的标准 cloudflare 地址进行延迟测试
provider_health_check_url = http://cloudflare.com
provider_health_check_interval = 300

# 强制注入所有策略组，并用全节点包 (!!MIN) 自动展开机场全量节点
proxy_group = 🚀 手动选择`select`[]♻️ 自动选择 [系统]`[]💰 币圈专用 [自选]`[]🇭🇰香港节点`[]🇯🇵日本节点`[]🇺🇸美国节点`[]🌐 全部节点 [系统]
proxy_group = 🤖 AI服务 [自选]`select`[]🇺🇸美国节点`[]🇯🇵日本节点`[]🚀 手动选择`[]🎯 全球直连
proxy_group = 🤖 ChatGPT`select`[]🇺🇸美国节点`[]🇯🇵日本节点`[]🚀 手动选择
proxy_group = 📺 油管专用 [自选]`select`[]🇭🇰香港节点`[]🇯🇵日本节点`[]🇺🇸美国节点`[]🚀 手动选择
proxy_group = 🎬 流媒体 [自选]`select`[]🇺🇸美国节点`[]🇯🇵日本节点`[]🇭🇰香港节点`[]🚀 手动选择
proxy_group = 🎬 Netflix`select`[]🇺🇸美国节点`[]🇯🇵日本节点`[]🚀 手动选择
proxy_group = 📢 Disney+`select`[]🇺🇸美国节点`[]🇯🇵日本节点`[]🚀 手动选择
proxy_group = 💬 即时通讯`select`[]🇭🇰香港节点`[]🇺🇸美国节点`[]🚀 手动选择
proxy_group = 💬 电报专用 [自选]`select`[]🇭🇰香港节点`[]🇺🇸美国节点`[]🚀 手动选择
proxy_group = 🌐 社交媒体`select`[]🇺🇸美国节点`[]🇭🇰香港节点`[]🚀 手动选择
proxy_group = 🇲🇸 微软服务 [自选]`select`[]🎯 全球直连`[]🚀 手动选择
proxy_group = 🍎 苹果服务 [自选]`select`[]🎯 全球直连`[]🚀 手动选择
proxy_group = 🔍 谷歌服务 [自选]`select`[]🇺🇸美国节点`[]🚀 手动选择
proxy_group = 🖥️ 软件分流 [自选]`select`[]🚀 手动选择`[]🎯 全球直连
proxy_group = 🌍 国外网站`select`!!MIN
proxy_group = 🇨🇳 国内网站`select`[]🎯 全球直连
proxy_group = 🐟 漏网之鱼`select`[]🚀 手动选择`[]🎯 全球直连

# ---------------- ★独立出来的币圈组 (顺便完美复活它) ----------------
proxy_group = 💰 币圈专用 [自选]`select`!!MIN`[]🎯 全球直连

# 系统与基础组
proxy_group = 🌐 全部节点 [系统]`select`!!MIN
proxy_group = ♻️ 自动选择 [系统]`url-test`!!MIN`http://cloudflare.com`300,,50
proxy_group = 🛑 广告拦截 [系统]`select`[]REJECT`[]🎯 全球直连`[]🚀 手动选择
proxy_group = 🎯 全球直连`select`[]DIRECT

# 兼容占位
proxy_group = 🇭🇰香港节点`select`!!MIN
proxy_group = 🇯🇵日本节点`select`!!MIN
proxy_group = 🇺🇸美国节点`select`!!MIN

# 显式硬编码本地规则
rules =
  - DOMAIN-KEYWORD,binance,💰 币圈专用 [自选]
  - DOMAIN-KEYWORD,okx,💰 币圈专用 [自选]
  - DOMAIN-KEYWORD,bybit,💰 币圈专用 [自选]
