; 国家节点筛选
custom_proxy_group=🇭🇰 香港节点`select`.*`(?=.*(港|HK|Hong))^((?!(台|日|韩|新|深|美)).)*$

custom_proxy_group=🇯🇵 日本节点`select`.*`(?=.*(日|JP|Japan))^((?!(港|台|韩|新|美)).)*$

custom_proxy_group=🇸🇬 狮城节点`select`.*`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$

custom_proxy_group=🇺🇲 美国节点`select`.*`(?=.*(美|US|States|America))^((?!(港|台|韩|新|日)).)*$

; 故障转移
custom_proxy_group=🔯 香港故转`fallback`.*`(?=.*(港|HK|Hong))^((?!(台|日|韩|新|深|美)).)*$`300,,https://www.gstatic.com/generate_204

custom_proxy_group=🔯 日本故转`fallback`.*`(?=.*(日|JP|Japan))^((?!(港|台|韩|新|美)).)*$`300,,https://www.gstatic.com/generate_204

custom_proxy_group=🔯 狮城故转`fallback`.*`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$`300,,https://www.gstatic.com/generate_204

custom_proxy_group=🔯 美国故转`fallback`.*`(?=.*(美|US|States|America))^((?!(港|台|韩|新|日)).)*$`300,,https://www.gstatic.com/generate_204

; 自动测速
custom_proxy_group=♻️ 香港自动`url-test`.*`(?=.*(港|HK|Hong))^((?!(台|日|韩|新|深|美)).)*$`300,20,https://www.gstatic.com/generate_204

custom_proxy_group=♻️ 日本自动`url-test`.*`(?=.*(日|JP|Japan))^((?!(港|台|韩|新|美)).)*$`300,20,https://www.gstatic.com/generate_204

custom_proxy_group=♻️ 狮城自动`url-test`.*`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|美)).)*$`300,20,https://www.gstatic.com/generate_204

custom_proxy_group=♻️ 美国自动`url-test`.*`(?=.*(美|US|States|America))^((?!(港|台|日|韩|新)).)*$`300,20,https://www.gstatic.com/generate_204

custom_proxy_group=♻️ 自动选择`url-test`.*`^((?!(直连)).)*$`300,20,https://www.gstatic.com/generate_204

custom_proxy_group=🌐 全部节点`select`.*

