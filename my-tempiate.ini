[custom]

; ============================================================
; OpenClash GitHub 在线模板
; 基于已实测 YAML 的策略组与规则逻辑整理
; 说明：
; 1. 机场订阅由 OpenClash/机场订阅本身提供，本模板不写死订阅 URL。
; 2. 规则集与策略组保持原 YAML 的核心逻辑。
; 3. 常用站点保留独立策略组，便于单独切换节点。
; ============================================================

; ---------------------------
; 常用站点规则集
; ---------------------------
ruleset=🤖 ChatGPT,https://raw.githubusercontent.com/jiadingren-cloud/my-template/refs/heads/main/rules/ChatGPT.list
ruleset=📹 YouTube,https://raw.githubusercontent.com/jiadingren-cloud/my-template/refs/heads/main/rules/YouTube.list
ruleset=🍀 Google,https://raw.githubusercontent.com/jiadingren-cloud/my-template/refs/heads/main/rules/Google.list
ruleset=👨🏿‍💻 GitHub,https://raw.githubusercontent.com/jiadingren-cloud/my-template/refs/heads/main/rules/GitHub.list
ruleset=🐬 OneDrive,https://raw.githubusercontent.com/jiadingren-cloud/my-template/refs/heads/main/rules/OneDrive.list
ruleset=🪟 Microsoft,https://raw.githubusercontent.com/jiadingren-cloud/my-template/refs/heads/main/rules/Microsoft.list
ruleset=🎵 TikTok,https://raw.githubusercontent.com/jiadingren-cloud/my-template/refs/heads/main/rules/TikTok.list
ruleset=📲 Telegram,https://raw.githubusercontent.com/jiadingren-cloud/my-template/refs/heads/main/rules/Telegram.list
ruleset=🎥 NETFLIX,https://raw.githubusercontent.com/jiadingren-cloud/my-template/refs/heads/main/rules/Netflix.list
ruleset=💶 PayPal,https://raw.githubusercontent.com/jiadingren-cloud/my-template/refs/heads/main/rules/PayPal.list

; ---------------------------
; 国内/私有/海外规则
; ---------------------------
ruleset=直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs
ruleset=直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
ruleset=直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs
ruleset=直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
ruleset=🚀 默认代理,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs

; ---------------------------
; IP 规则
; ---------------------------
ruleset=🍀 Google,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs
ruleset=🎥 NETFLIX,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.mrs
ruleset=📲 Telegram,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs
ruleset=直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/apple.mrs

; ---------------------------
; 最终匹配
; ---------------------------
final=🐟 漏网之鱼

; ============================================================
; 策略组
; ============================================================

