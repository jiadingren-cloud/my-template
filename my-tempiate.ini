[General]
; ==================== 全局通用配置 ====================
mixed-port = 7890
allow-lan = true
bind-address = "*"
ipv6 = false
unified-delay = true
tcp-concurrent = true
log-level = info
keep-alive-idle = 600
keep-alive-interval = 15

; ==================== Zashboard 面板配置 ====================
external-controller = 0.0.0.0:9090
secret = ""
external-ui = ui
external-ui-url = "https://gh-proxy.com"

; ==================== 流量嗅探器配置 ====================
sniffer = true
sniffer-tls = true
sniffer-http = true
sniffer-quic = true
sniffer-skip-domain = "Mijia Cloud", "+.push.apple.com"
sniffer-override-destination = true

; ==================== Tun 网卡入站配置（旁路由核心） ====================
tun-enable = true
tun-stack = mixed
tun-dns-hijack = "any:53", "tcp://any:53"
tun-auto-route = true
tun-auto-redirect = true
tun-auto-detect-interface = true

; ==================== DNS 模块（联动 AdGuard Home 最佳实践） ====================
dns-enable = true
dns-ipv6 = false
dns-enhanced-mode = fake-ip
dns-fake-ip-range = 198.18.0.0/16
; 将内网网段加入黑名单，防止 fake-ip 导致内网服务访问失败
dns-fake-ip-filter = "*", "+.lan", "+.local", "+.market.xiaomi.com", "192.168.0.*"
; Bootstrap 用于解析加密 DNS 域名，防止死循环
default-nameserver = 223.5.5.5, 119.29.29.29
; 核心上游解析交给加密远端 DNS
nameserver = https://alidns.com, https://doh.pub

