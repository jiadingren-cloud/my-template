; 自动测速
custom_proxy_group=♻️ 香港自动`url-test`(港|HK|Hong)`http://gstatic.com`300,,50

custom_proxy_group=♻️ 日本自动`url-test`(日|JP|Japan)`http://gstatic.com`300,,50

custom_proxy_group=♻️ 狮城自动`url-test`(新加坡|坡|狮城|SG|Singapore)`http://gstatic.com`300,,50

