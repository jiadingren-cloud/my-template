[custom]
; 此模板由 config.yaml 转换而来，保留了原有的策略组和规则逻辑

; ==================================================
; 1. 策略组定义 (Proxy Groups)
; ==================================================

; 主策略组，作为默认出口
custom_proxy_group=🚀 默认代理`select`.*

; 应用分流策略组
custom_proxy_group=📹 YouTube`select`.*
custom_proxy_group=🍀 Google`select`.*
custom_proxy_group=🤖 ChatGPT`select`.*
custom_proxy_group=👨🏿‍💻 GitHub`select`.*
custom_proxy_group=🐬 OneDrive`select`.*
custom_proxy_group=🪟 Microsoft`select`.*
custom_proxy_group=🎵 TikTok`select`.*
custom_proxy_group=📲 Telegram`select`.*
custom_proxy_group=🎥 NETFLIX`select`.*
custom_proxy_group=💶 PayPal`select`.*
custom_proxy_group=🐟 漏网之鱼`select`.*

; 节点筛选策略组 (自动分类)
; 香港节点
custom_proxy_group=🇭🇰 香港节点`select`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$
; 日本节点
custom_proxy_group=🇯🇵 日本节点`select`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$
; 新加坡节点
custom_proxy_group=🇸🇬 狮城节点`select`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$
; 美国节点
custom_proxy_group=🇺🇲 美国节点`select`(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$

; 故转 (Fallback) 策略组
custom_proxy_group=🔯 香港故转`fallback`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 日本故转`fallback`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 狮城故转`fallback`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 美国故转`fallback`(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$`http://www.gstatic.com/generate_204`300,,50

; 自动选择 (URL-Test) 策略组
custom_proxy_group=♻️ 香港自动`url-test`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=♻️ 日本自动`url-test`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=♻️ 狮城自动`url-test`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|韩|日|美)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=♻️ 美国自动`url-test`(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=♻️ 自动选择`url-test`^((?!(直连)).)*$`http://www.gstatic.com/generate_204`300,,50

; 全部节点
custom_proxy_group=🌐 全部节点`select`.*

; ==================================================
; 2. 规则定义 (Rules)
; ==================================================
; 注意：.ini 模板不支持 .mrs 二进制规则集，这里使用标准的 DOMAIN-SUFFIX/KEYWORD 规则替代
; 如果你需要精确的 .mrs 规则，建议在客户端本地配置，而不是通过在线转换。

; --- 基础规则 ---
; 私有网络直连
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
IP-CIDR6,fd00::/8,DIRECT,no-resolve

; --- 应用分流规则 ---
; AI & ChatGPT
DOMAIN-SUFFIX,openai.com,🤖 ChatGPT
DOMAIN-SUFFIX,chatgpt.com,🤖 ChatGPT
DOMAIN-KEYWORD,ai,🤖 ChatGPT

; GitHub
DOMAIN-SUFFIX,github.com,👨🏿‍💻 GitHub
DOMAIN-SUFFIX,github.io,👨🏿‍💻 GitHub
DOMAIN-SUFFIX,githubassets.com,👨🏿‍💻 GitHub

; YouTube
DOMAIN-SUFFIX,youtube.com,📹 YouTube
DOMAIN-SUFFIX,ytimg.com,📹 YouTube
DOMAIN-SUFFIX,googlevideo.com,📹 YouTube
DOMAIN-KEYWORD,youtube,📹 YouTube

; Google
DOMAIN-SUFFIX,google.com,🍀 Google
DOMAIN-SUFFIX,googleapis.com,🍀 Google
DOMAIN-SUFFIX,gstatic.com,🍀 Google
DOMAIN-KEYWORD,google,🍀 Google

; Telegram
DOMAIN-SUFFIX,telegram.org,📲 Telegram
DOMAIN-SUFFIX,telegram.me,📲 Telegram
DOMAIN-SUFFIX,t.me,📲 Telegram
DOMAIN-KEYWORD,telegram,📲 Telegram

; Netflix
DOMAIN-SUFFIX,netflix.com,🎥 NETFLIX
DOMAIN-SUFFIX,netflix.net,🎥 NETFLIX
DOMAIN-SUFFIX,nflxso.net,🎥 NETFLIX
DOMAIN-KEYWORD,netflix,🎥 NETFLIX

; TikTok
DOMAIN-SUFFIX,tiktok.com,🎵 TikTok
DOMAIN-SUFFIX,tiktokv.com,🎵 TikTok
DOMAIN-KEYWORD,tiktok,🎵 TikTok

; Microsoft & OneDrive
DOMAIN-SUFFIX,microsoft.com,🪟 Microsoft
DOMAIN-SUFFIX,windows.com,🪟 Microsoft
DOMAIN-SUFFIX,onedrive.com,🐬 OneDrive
DOMAIN-SUFFIX,live.com,🐬 OneDrive
DOMAIN-KEYWORD,microsoft,🪟 Microsoft

; PayPal
DOMAIN-SUFFIX,paypal.com,💶 PayPal
DOMAIN-SUFFIX,paypalobjects.com,💶 PayPal

; Apple (直连)
DOMAIN-SUFFIX,apple.com,DIRECT
DOMAIN-SUFFIX,icloud.com,DIRECT
DOMAIN-SUFFIX,mzstatic.com,DIRECT
DOMAIN-KEYWORD,apple,DIRECT

; --- 最终规则 ---
; 中国国内直连
GEOIP,CN,DIRECT
; 漏网之鱼走默认代理
MATCH,🐟 漏网之鱼

; ==================================================
; 3. 设置
; ==================================================
enable_rule_generator=true
overwrite_original_rules=true
