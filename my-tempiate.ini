[custom]
; 设置规则标志位，用于生成策略组
custom_proxy_group=🚀 默认代理`select`.*
custom_proxy_group=📹 YouTube`select`.*
custom_proxy_group=🍀 Google`select`.*
custom_proxy_group=🤖 ChatGPT`select`.*
custom_proxy_group=👨🏿‍💻 GitHub`select`.*
custom_proxy_group=🐬 OneDrive`select`.*
custom_proxy_group=🪟 Microsoft`select`.*
custom_proxy_group=🎵 TikTok`select`.*
custom_proxy_group=📲 Telegram`select`.*
custom_proxy_group=🎥 NETFLIX`select`.*
custom_proxy_group=💶 PayPal`select`.*
custom_proxy_group=🐟 漏网之鱼`select`.*
custom_proxy_group=🇭🇰 香港节点`select`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$
custom_proxy_group=🇯🇵 日本节点`select`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$
custom_proxy_group=🇸🇬 狮城节点`select`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$
custom_proxy_group=🇺🇲 美国节点`select`(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$

; 自动选择与故障转移组 (url-test / fallback)
; 注意：在线转换工具对 include-all 支持有限，这里使用正则匹配节点名称
custom_proxy_group=🔯 香港故转`fallback`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$
custom_proxy_group=🔯 日本故转`fallback`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$
custom_proxy_group=🔯 狮城故转`fallback`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$
custom_proxy_group=🔯 美国故转`fallback`(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$

custom_proxy_group=♻️ 香港自动`url-test`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$
custom_proxy_group=♻️ 日本自动`url-test`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$
custom_proxy_group=♻️ 狮城自动`url-test`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|韩|日|美)).)*$
custom_proxy_group=♻️ 美国自动`url-test`(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$
custom_proxy_group=♻️ 自动选择`url-test`^((?!(直连)).)*$

; 全局策略组
custom_proxy_group=🌐 全部节点`select`.*

; 引入外部规则文件 (对应原 YAML 的 rule-providers)
; 这里假设你把规则文件放在同一个 GitHub 仓库下
rule_provider=private_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs
rule_provider=ai,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs
rule_provider=youtube_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs
rule_provider=google_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs
rule_provider=github_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs
rule_provider=telegram_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs
rule_provider=netflix_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs
rule_provider=paypal_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/paypal.mrs
rule_provider=onedrive_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/onedrive.mrs
rule_provider=microsoft_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs
rule_provider=apple_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs
rule_provider=tiktok_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs
rule_provider=geolocation-!cn,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs
rule_provider=cn_domain,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
rule_provider=private_ip,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs
rule_provider=cn_ip,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
rule_provider=google_ip,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs
rule_provider=telegram_ip,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs
rule_provider=netflix_ip,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.mrs
rule_provider=apple_ip,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geoip/apple.mrs

; 规则匹配逻辑 (对应原 YAML 的 rules)
; 格式：规则类型,规则内容,策略组名称
RULE-SET,private_ip,直连,no-resolve
RULE-SET,private_domain,直连
DOMAIN-SUFFIX,qichiyu.com,🚀 默认代理
RULE-SET,ai,🤖 ChatGPT
RULE-SET,github_domain,👨🏿‍💻 GitHub
RULE-SET,youtube_domain,📹 YouTube
RULE-SET,google_domain,🍀 Google
RULE-SET,onedrive_domain,🐬 OneDrive
RULE-SET,microsoft_domain,🪟 Microsoft
RULE-SET,apple_domain,直连
RULE-SET,tiktok_domain,🎵 TikTok
RULE-SET,telegram_domain,📲 Telegram
RULE-SET,netflix_domain,🎥 NETFLIX
RULE-SET,paypal_domain,💶 PayPal
RULE-SET,apple_ip,直连
RULE-SET,google_ip,🍀 Google
RULE-SET,netflix_ip,🎥 NETFLIX
RULE-SET,telegram_ip,📲 Telegram
RULE-SET,geolocation-!cn,🚀 默认代理
RULE-SET,cn_domain,直连
RULE-SET,cn_ip,直连
MATCH,🐟 漏网之鱼

; 基础配置
enable_rule_generator=true
overwrite_original_rules=true
