[custom]
; 启用规则生成器（必须），让 subconverter 根据 ruleset 自动生成 Clash 的 rule-providers
enable_rule_generator=true
; 覆盖原有规则（推荐开启，避免默认规则干扰）
overwrite_original_rules=true

; ==================== 基础配置 ====================
clash_rule_base=base/forcerule.yml
; 启用 UDP
udp=true
; 节点排序（可选）
; sort=true

; ==================== 策略组定义 ====================
; 语法：组名`类型`筛选正则`测试URL`间隔,,容差
; 节点由订阅链接带入，这里只定义如何分组和筛选

; 地区节点组（筛选包含特定关键词的节点）
🇭🇰 香港节点`url-test`(港|HK|Hong)`http://www.gstatic.com/generate_204`300,,50
🇯🇵 日本节点`url-test`(日|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
🇸🇬 狮城节点`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50
🇺🇲 美国节点`url-test`(美|US|States|America)`http://www.gstatic.com/generate_204`300,,50

; 全部节点组（包含所有节点，排除直连）
🌐 全部节点`select`.*`http://www.gstatic.com/generate_204`300,,50

; 故障转移组（自动选择第一个可用节点）
🔯 香港故转`fallback`(港|HK|Hong)`http://www.gstatic.com/generate_204`300,,50
🔯 日本故转`fallback`(日|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
🔯 狮城故转`fallback`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50
🔯 美国故转`fallback`(美|US|States|America)`http://www.gstatic.com/generate_204`300,,50

; 自动选择组（选择延迟最低的）
♻️ 香港自动`url-test`(港|HK|Hong)`http://www.gstatic.com/generate_204`300,,50
♻️ 日本自动`url-test`(日|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
♻️ 狮城自动`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50
♻️ 美国自动`url-test`(美|US|States|America)`http://www.gstatic.com/generate_204`300,,50
♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 功能策略组（选择类型，手动切换）
🚀 默认代理`select`.*`http://www.gstatic.com/generate_204`300,,50
📹 YouTube`select`.*`http://www.gstatic.com/generate_204`300,,50
🍀 Google`select`.*`http://www.gstatic.com/generate_204`300,,50
🤖 ChatGPT`select`.*`http://www.gstatic.com/generate_204`300,,50
👨🏿‍💻 GitHub`select`.*`http://www.gstatic.com/generate_204`300,,50
🐬 OneDrive`select`.*`http://www.gstatic.com/generate_204`300,,50
🪟 Microsoft`select`.*`http://www.gstatic.com/generate_204`300,,50
🎵 TikTok`select`.*`http://www.gstatic.com/generate_204`300,,50
📲 Telegram`select`.*`http://www.gstatic.com/generate_204`300,,50
🎥 NETFLIX`select`.*`http://www.gstatic.com/generate_204`300,,50
💶 PayPal`select`.*`http://www.gstatic.com/generate_204`300,,50
🐟 漏网之鱼`select`.*`http://www.gstatic.com/generate_204`300,,50

; ==================== 规则集引用 ====================
; 格式：ruleset=策略组名,规则类型:规则文件路径或URL,更新间隔(秒)
; 规则类型：clash-domain (域名), clash-ipcidr (IP), clash-classic (通用)
; 如果文件在本地，使用 rules/文件名.list；如果在远程，使用完整 URL

; --- 私有/本地规则 ---
ruleset=直连,clash-domain:rules/private_domain.list,86400
ruleset=直连,clash-ipcidr:rules/private_ip.list,86400

; --- 自定义应用规则（使用你上传的 list 文件）---
ruleset=🤖 ChatGPT,clash-domain:rules/ai.list,86400
ruleset=📹 YouTube,clash-domain:rules/youtube.list,86400

; --- 第三方规则集（直接引用远程 URL）---
; 注意：subconverter 对 mrs 格式的支持可能有限，建议使用 yaml 或 text 格式
; 这里使用远程 ruleset 的 yaml 格式示例
ruleset=👨🏿‍💻 GitHub,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.yaml,86400
ruleset=🍀 Google,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.yaml,86400
ruleset=🐬 OneDrive,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/onedrive.yaml,86400
ruleset=🪟 Microsoft,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.yaml,86400
ruleset=直连,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.yaml,86400
ruleset=🎵 TikTok,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.yaml,86400
ruleset=📲 Telegram,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.yaml,86400
ruleset=🎥 NETFLIX,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.yaml,86400
ruleset=💶 PayPal,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/paypal.yaml,86400
ruleset=🍀 Google,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.yaml,86400
ruleset=🎥 NETFLIX,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.yaml,86400
ruleset=📲 Telegram,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.yaml,86400
ruleset=直连,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/apple.yaml,86400

; --- 中国大陆分流 ---
ruleset=直连,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.yaml,86400
ruleset=直连,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.yaml,86400

; --- 国外兜底 ---
ruleset=🚀 默认代理,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.yaml,86400

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL