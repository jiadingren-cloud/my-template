[General]
; ==================== 全局通用配置 ====================
mixed-port = 7893
port = 7890
socks-port = 7891
redir-port = 7892
tproxy-port = 7895
allow-lan = true
bind-address = "*"
ipv6 = false
log-level = info
keep-alive-idle = 600
keep-alive-interval = 15
secret = "gQKxGXPM"

; ==================== 核心面板与实验性配置 ====================
external-controller = 0.0.0.0:9090
external-ui = "/usr/share/openclash/ui"
external-ui-name = metacubexd
external-ui-url = "https://github.com"
profile-store-selected = true

experimental = "quic-go-disable-gso: true"

; ==================== Geo 数据源配置 ====================
geox-url-mmdb = "https://jsdelivr.net"
geox-url-geoip = "https://jsdelivr.net"
geox-url-geosite = "https://jsdelivr.net"
geox-url-asn = "https://jsdelivr.net"

; ==================== NTP 时间同步 ====================
ntp-enable = true
ntp-server = "://apple.com"
ntp-port = 123
ntp-interval = 30
ntp-write-to-system = true

; ==================== DNS 模块（完美接管网关） ====================
dns-enable = true
dns-ipv6 = false
dns-enhanced-mode = fake-ip
dns-fake-ip-range = 198.18.0.1/16
dns-listen = 0.0.0.0:7874
dns-respect-rules = false
; 传统无污染 DNS 作为 bootstrap
default-nameserver = 114.114.114.114, 119.29.29.29
nameserver = 114.114.114.114, 119.29.29.29, 8.8.8.8, 1.1.1.1
fallback = https://cloudflare.com, https://dns.google

[ProxyGroup]
; ==================== 1. 核心业务策略组（用户手动选择） ====================
; 🎯 新增 AI、ChatGPT、YouTube 独立分组逻辑
🚀 默认代理 = select, 🔯 香港故转, 🔯 日本故转, 🔯 美国故转, ♻️ 香港自动, ♻️ 日本自动, ♻️ 美国自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点, DIRECT
🤖 AI与ChatGPT = select, 🚀 默认代理, 🔯 日本故转, 🔯 美国故转, ♻️ 日本自动, ♻️ 美国自动, ♻️ 自动选择, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点, DIRECT
📹 YouTube = select, 🚀 默认代理, 🔯 美国故转, 🔯 日本故转, ♻️ 美国自动, ♻️ 日本自动, ♻️ 自动选择, 🇺🇲 美国节点, 🇯🇵 日本节点, 🌐 全部节点, DIRECT
🍀 Google服务 = select, 🚀 默认代理, 🔯 香港故转, 🔯 日本故转, 🔯 美国故转, ♻️ 香港自动, ♻️ 日本自动, ♻️ 美国自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点, DIRECT
👨🏿‍💻 GitHub = select, 🚀 默认代理, 🔯 香港故转, 🔯 日本故转, 🔯 美国故转, ♻️ 香港自动, ♻️ 日本自动, ♻️ 美国自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点, DIRECT
📲 电报信息 = select, 🚀 默认代理, 🔯 香港故转, 🔯 日本故转, 🔯 美国故转, ♻️ 香港自动, ♻️ 日本自动, ♻️ 美国自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点, DIRECT
🎥 NETFLIX = select, 🚀 默认代理, 🔯 日本故转, 🔯 美国故转, 🔯 香港故转, ♻️ 日本自动, ♻️ 美国自动, ♻️ 香港自动, ♻️ 自动选择, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇭🇰 香港节点, 🌐 全部节点, DIRECT
🎵 TikTok = select, 🚀 默认代理, 🔯 日本故转, 🔯 美国故转, ♻️ 日本自动, ♻️ 美国自动, ♻️ 自动选择, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点, DIRECT
Ⓜ️ 微软服务 = select, DIRECT, 🚀 默认代理, 🌐 全部节点
⛔️ 广告拦截 = select, REJECT, DIRECT, 🚀 默认代理
🪚 运营劫持 = select, REJECT, DIRECT, 🚀 默认代理
🌐 国内媒体 = select, DIRECT, 🇭🇰 香港节点, 🌐 全部节点, 🚀 默认代理
🐟 漏网之鱼 = select, 🚀 默认代理, DIRECT

; ==================== 2. 地区节点筛选组 (根据你的机场节点名规律精确匹配) ====================
🇭🇰 香港节点 = select, []规则(?=.*(香港|港|HK|Hong))^((?!(直连|日本|美国|US|JP)).)*$
🇯🇵 日本节点 = select, []规则(?=.*(日本|日|JP|Japan))^((?!(直连|香港|美国|US|HK)).)*$
🇺🇲 美国节点 = select, []规则(?=.*(美国|美|US|America|^usd))^((?!(直连|香港|日本|JP|HK)).)*$
🌐 全部节点 = select, []规则^((?!(网址|过期时间)).)*$

; ==================== 3. 故障转移组 (Fallback) ====================
🔯 香港故转 = fallback, []规则(?=.*(香港|港|HK|Hong))^((?!(直连|日本|美国|US|JP)).)*$, http://gstatic.com, 300
🔯 日本故转 = fallback, []规则(?=.*(日本|日|JP|Japan))^((?!(直连|香港|美国|US|HK)).)*$, http://gstatic.com, 300
🔯 美国故转 = fallback, []规则(?=.*(美国|美|US|America|^usd))^((?!(直连|香港|日本|JP|HK)).)*$, http://gstatic.com, 300

; ==================== 4. 自动测速组 (Url-test) ====================
♻️ 香港自动 = url-test, []规则(?=.*(香港|港|HK|Hong))^((?!(直连|日本|美国|US|JP)).)*$, http://gstatic.com, 300,, 20
♻️ 日本自动 = url-test, []规则(?=.*(日本|日|JP|Japan))^((?!(直连|香港|美国|US|HK)).)*$, http://gstatic.com, 300,, 20
♻️ 美国自动 = url-test, []规则(?=.*(美国|美|US|America|^usd))^((?!(直连|香港|日本|JP|HK)).)*$, http://gstatic.com, 300,, 20
♻️ 自动选择 = url-test, []规则^((?!(直连|网址|过期时间)).)*$, http://gstatic.com, 300,, 20

