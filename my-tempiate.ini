; ============================================================
; OpenClash GitHub 在线模板
; 基于已实测 YAML 的策略组与规则逻辑整理
; 说明：
; 1. 机场订阅由 OpenClash/机场订阅本身提供，本模板不写死订阅 URL。
; 2. 规则集与策略组保持原 YAML 的核心逻辑。
; 3. 常用站点保留独立策略组，便于单独切换节点。
; ============================================================

; ---------------------------
; 常用站点规则集
; ---------------------------
ruleset=🤖 ChatGPT,https://githubusercontent.com
ruleset=📹 YouTube,https://githubusercontent.com
ruleset=🍀 Google,https://githubusercontent.com
ruleset=👨🏿‍💻 GitHub,https://githubusercontent.com
ruleset=🐬 OneDrive,https://githubusercontent.com
ruleset=🪟 Microsoft,https://githubusercontent.com
ruleset=🎵 TikTok,https://githubusercontent.com
ruleset=📲 Telegram,https://githubusercontent.com
ruleset=🎥 NETFLIX,https://githubusercontent.com
ruleset=💶 PayPal,https://githubusercontent.com

; ---------------------------
; 国内/私有/海外规则
; ---------------------------
ruleset=直连,https://githubusercontent.com
ruleset=直连,https://githubusercontent.com
ruleset=直连,https://githubusercontent.com
ruleset=直连,https://githubusercontent.com
ruleset=🚀 默认代理,https://githubusercontent.com

; ---------------------------
; IP 规则
; ---------------------------
ruleset=🍀 Google,https://githubusercontent.com
ruleset=🎥 NETFLIX,https://githubusercontent.com
ruleset=📲 Telegram,https://githubusercontent.com
ruleset=直连,https://githubusercontent.com

; ---------------------------
; 最终匹配
; ---------------------------
final=🐟 漏网之鱼

