# ============================================================
# Jiadingren · 纯净主配置 (直连九云机场 + 旁路由 + AdGuard 优化版)
# ============================================================

# 基础配置
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false

# ============================================================
# 节点提供者 (直接从你的九云机场无缝拉取节点)
# ============================================================
proxy-providers:
  Jiuyun-Airport:
    type: http
    path: ./profiles/jiuyun_nodes.yaml
    url: "https://jiuyundy.com"
    interval: 86400
    health-check:
      enable: true
      url: https://cloudflare.com
      interval: 600

# ============================================================
# TUN (旁路由单网口环境建议关闭，由 OpenClash 主界面全局管理)
# ============================================================
tun:
  enable: false

# ============================================================
# DNS (已针对本机 AdGuard Home 5335 优化闭环)
# ============================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'ntp*.aliyun.com'
  nameserver:
    - https://doh.pub
    - https://alidns.com
  proxy-server-nameserver:
    - https://doh.pub

# ============================================================
# Rule Providers (云端规则集)
# ============================================================
rule-providers:
  ads:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://githubusercontent.com"
  ai:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://githubusercontent.com"
  youtube:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://githubusercontent.com"
  crypto:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://githubusercontent.com"
  disney:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://githubusercontent.com"
  apple:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://githubusercontent.com"
  google:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://githubusercontent.com"
  software:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://githubusercontent.com"

