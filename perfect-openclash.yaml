      - "🇯🇵 日本节点 [系统]"
      - "🇺🇸 美国节点 [系统]"
      - "🇹🇼 台湾节点 [系统]"
      - "🌍 其他地区 [系统]"
      - "🌐 全部节点 [系统]"
