# ============================================================
# Jiadingren实验室 · Clash 完美分流 3.0 (旁路由 + AdGuard Home 专属优化版)
# ============================================================

# 关闭 IPv6，避免 IPv4 / IPv6 出口不一致
ipv6: false

# ============================================================
# TUN (旁路由单网口环境建议关闭，由 OpenClash 主界面全局管理)
# ============================================================
tun:
  enable: false

# ============================================================
# DNS (已针对本机 AdGuard Home 5335 优化闭环)
# ============================================================
dns:
  enable: true

  # DNS 服务监听，保持 1053 供 AdGuard Home 作为上游调用
  listen: 0.0.0.0:1053

  # 禁止返回 IPv6 DNS 记录
  ipv6: false

  # Fake-IP
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # Fake-IP 黑名单
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'ntp*.aliyun.com'

  # DNS 上游 (Mihomo 解析国外，并发测速最快的 DoH)
  nameserver:
    - https://doh.pub
    - https://alidns.com

  # 代理节点域名解析
  proxy-server-nameserver:
    - https://doh.pub

# ============================================================
# Rule Providers
# ============================================================
rule-providers:

  ads:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    url: "https://jsdelivr.net"

