  - name: "🖥️ 软件分流 [自选]"
    type: select
    proxies:
      - "🚀 默认代理 [自选]"
      - "♻️ 自动选择 [系统]"
      - "🇭🇰 香港节点 [系统]"
      - "🇯🇵 日本节点 [系统]"
      - "🇸🇬 新加坡节点 [系统]"
      - "🇺🇸 美国节点 [系统]"
      - "🇹🇼 台湾节点 [系统]"
      - "🌍 其他地区 [系统]"
      - "🌐 全部节点 [系统]"
      - DIRECT

  # ---------- 系统内核联动组 ----------
  - name: "🌐 全部节点 [系统]"
    type: select
    use:
      - Jiuyun-Airport

  - name: "♻️ 自动选择 [系统]"
    type: url-test
    use:
      - Jiuyun-Airport
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website"
    url: "https://cloudflare.com"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇭🇰 香港节点 [系统]"
    type: url-test
    use:
      - Jiuyun-Airport
    filter: '(?i)🇭🇰|香港|港|\bHK\b|\bHKG\b|Hong[ -]?Kong'
    exclude-filter: '(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website'
    url: "https://cloudflare.com"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇯🇵 日本节点 [系统]"
    type: url-test
    use:
      - Jiuyun-Airport
    filter: '(?i)🇯🇵|日本|日|\bJP\b|\bJPN\b|Japan|Tokyo|Osaka'
    exclude-filter: '(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website'
    url: "https://cloudflare.com"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇸🇬 新加坡节点 [系统]"
    type: url-test
    use:
      - Jiuyun-Airport
    filter: '(?i)🇸🇬|新加坡|新国|\bSG\b|\bSGP\b|Singapore'
    exclude-filter: '(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website'
    url: "https://cloudflare.com"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇺🇸 美国节点 [系统]"
    type: url-test
    use:
      - Jiuyun-Airport
    filter: '(?i)🇺🇸|美国|美|\bUS\b|\bUSA\b|United[ -]?States|America|Los[ -]?Angeles|New[ -]?York|San[ -]?Francisco'
    exclude-filter: '(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website'
    url: "https://cloudflare.com"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇹🇼 台湾节点 [系统]"
    type: url-test
    use:
      - Jiuyun-Airport
    filter: '(?i)🇹🇼|台湾|台|\bTW\b|\bTWN\b|Taiwan|Taipei'
    exclude-filter: '(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website'
    url: "https://cloudflare.com"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🌍 其他地区 [系统]"
    type: select
    use:
      - Jiuyun-Airport
    filter: '(?i)^(?!.*(?:🇭🇰|🇯🇵|🇸🇬|🇺🇸|🇹🇼|香港|日本|新加坡|美国|台湾|\bHK\b|\bHKG\b|\bJP\b|\bJPN\b|\bSG\b|\bSGP\b|\bUS\b|\bUSA\b|\bTW\b|\bTWN\b|Hong[ -]?Kong|Japan|Tokyo|Osaka|Singapore|United[ -]?States|America|Los[ -]?Angeles|New[ -]?York|San[ -]?Francisco|Taiwan|Taipei)).*'
    exclude-filter: '(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website'

  - name: "🛑 广告拦截 [系统]"
    type: select
    proxies:
      - REJECT
      - DIRECT

# ============================================================
# Rules (分流路由策略)
# ============================================================
rules:
  # 1. 旁路由防锁死保护
  - "IP-CIDR,192.168.0.9/32,DIRECT,no-resolve"
  - "IP-CIDR,192.168.0.1/32,DIRECT,no-resolve"

  # 2. 软件进程优先
  - "RULE-SET,software,🖥️ 软件分流 [自选]"

  # 3. 私有局域网直连
  - "GEOSITE,private,DIRECT"
  - "GEOIP,private,DIRECT,no-resolve"

  # 4. 广告拦截
  - "RULE-SET,ads,🛑 广告拦截 [系统]"

  # 5. AI服务
  - "RULE-SET,ai,🤖 AI服务 [自选]"

  # 6. 视频与流媒体
  - "RULE-SET,youtube,📺 油管专用 [自选]"
  - "RULE-SET,disney,🎬 流媒体 [自选]"
  - "GEOSITE,netflix,🎬 流媒体 [自选]"

  # 7. 币圈
  - "RULE-SET,crypto,💰 币圈专用 [自选]"

  # 8. 大厂生态
  - "RULE-SET,apple,🍎 苹果服务 [自选]"
  - "RULE-SET,google,🔍 谷歌服务 [自选]"
  - "GEOSITE,telegram,💬 电报专用 [自选]"
  - "GEOSITE,microsoft,🇲🇸 微软服务 [自选]"

  # 9. 中国大陆流量直连
  - "GEOSITE,CN,DIRECT"
  - "GEOIP,CN,DIRECT,no-resolve"

  # 10. 兜底规则
  - "MATCH,🚀 默认代理 [自选]"
